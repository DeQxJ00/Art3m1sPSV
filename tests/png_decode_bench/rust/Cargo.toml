[package]
name = "png-decode-bench"
version = "0.1.0"
edition = "2021"
[workspace]
[lib]
crate-type = ["staticlib"]
[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
[target.'cfg(not(target_os = "vita"))'.dependencies]
pfs-upk = { package = "pfs-upk-rust", path = "../../../core/crates/pfs-upk-rust" }
[profile.release]
opt-level = 3
panic = "abort"
